name: Cleanup Orphaned Branch Deployments

on:
  schedule:
    # Run daily at 1 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write
  contents: read

env:
  PRODUCTION_RG: 'rg-production'

jobs:
  cleanup:
    name: Find and Cleanup Orphaned Deployments
    runs-on: ubuntu-latest
    environment: production
    # Shared with Azure CICD's deploy job, not its build/test jobs.
    concurrency:
      group: astervoids-azure-resource-mutations
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cleanup orphaned branch apps, storage, DNS and certificates
        env:
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          CUSTOM_SUBDOMAIN: ${{ secrets.CUSTOM_SUBDOMAIN }}
        run: node .github/scripts/cleanup-orphans.mjs

      - name: Cleanup old ACR container images (> 14 days)
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🗑️ Purging ACR images older than 14 days" >> $GITHUB_STEP_SUMMARY

          # Discover the ACR in the production resource group
          ACR_NAME=$(az acr list \
            --resource-group "${{ env.PRODUCTION_RG }}" \
            --query "[0].name" -o tsv 2>/dev/null || echo "")

          if [ -z "$ACR_NAME" ]; then
            echo "No ACR found in ${{ env.PRODUCTION_RG }}, skipping image purge"
            echo "- ⚠️ No ACR found, skipped" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Using ACR: $ACR_NAME"

          # List repositories and purge anything older than 14 days.
          # --untagged also removes dangling manifests. --keep 1 ensures we
          # never delete the most recent image even if it's old.
          REPOS=$(az acr repository list --name "$ACR_NAME" -o tsv 2>/dev/null || echo "")

          # Build a single acr purge invocation with one --filter per repo.
          # Chaining multiple `acr purge` calls with `;` breaks because `acr`
          # is only available as a built-in for the first command in the
          # ACR Tasks runtime; subsequent invocations fall back to /bin/sh
          # where `acr` is not on PATH and the run exits 127.
          PURGE_FILTERS=""
          for REPO in $REPOS; do
            PURGE_FILTERS="$PURGE_FILTERS --filter '${REPO}:.*'"
          done

          if [ -z "$PURGE_FILTERS" ]; then
            echo "No repositories found in $ACR_NAME"
            echo "- ℹ️ No repositories to purge" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          PURGE_CMD="acr purge $PURGE_FILTERS --ago 14d --untagged --keep 1"
          echo "Running purge: $PURGE_CMD"
          az acr run \
            --registry "$ACR_NAME" \
            --cmd "$PURGE_CMD" \
            /dev/null

          echo "- ✅ Purged images older than 14 days from \`$ACR_NAME\`" >> $GITHUB_STEP_SUMMARY
