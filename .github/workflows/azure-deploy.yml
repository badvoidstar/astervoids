name: Azure CICD

on:
  push:
    branches:
      - '**'  # All branches
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  # Shared resource naming conventions
  PRODUCTION_RG: 'rg-production'
  CONTAINER_ENV_NAME: 'cae-production'
  CONTAINER_APP_PREFIX: 'ca-web'
  # ── Multi-region rollout ──────────────────────────────────────────────────
  # Source of truth: the GitHub repository variable REGIONS_JSON
  # (Settings → Secrets and variables → Actions → Variables tab).
  # Empty string preserves the legacy single-region production deploy
  # (everything in westus2 under cae-production). To roll out multi-region,
  # set the REGIONS_JSON repo variable to a JSON array of region objects:
  #
  #   [
  #     {"name":"westus2","location":"westus2","displayName":"US West"},
  #     {"name":"northeurope","location":"northeurope","displayName":"Europe"},
  #     {"name":"japaneast","location":"japaneast","displayName":"Asia"}
  #   ]
  #
  # The first entry is the "primary" region — it owns the shared ACR and
  # branch deployments target its CAE. Only applied when deploying main;
  # branches always go single-region into the primary region's CAE.
  REGIONS_JSON: ${{ vars.REGIONS_JSON }}
  # ── BYO TLS certificate (optional) ────────────────────────────────────────
  # When all three are set, bicep binds <subdomain>.<domain> on every region
  # (and every branch deploy) to a Key Vault-stored certificate — no per-app
  # DigiCert managed-cert provisioning runs. Recommended path for multi-region
  # where per-region ACA hostnames are bound with one shared wildcard cert.
  # See ARCHITECTURE.md "BYO wildcard cert for regional hostnames".
  #
  # Single-region production and branch previews fall back to the legacy
  # DigiCert managed-cert flow when the BYO values are empty. Multi-region
  # production requires the BYO URL/name pair and is rejected before Azure
  # resources are created when it is absent.
  #
  # Set via repo variables (Settings → Secrets and variables → Actions → Variables):
  #   CERT_KEY_VAULT_SECRET_URL    e.g. https://my-kv.vault.azure.net/secrets/wildcard-your-domain-com
  #   CERT_KEY_VAULT_CERT_NAME     e.g. wildcard-your-domain-com (stable name for the CAE cert resource)
  #   CERT_READER_IDENTITY_ID      resource ID of a user-assigned managed identity that has
  #                                 'Key Vault Certificate User' role on the KV holding the cert.
  #                                 OPTIONAL in production when bicep's manageAcmebotPermissions=true
  #                                 (the default — bicep creates id-acme-cert-reader and uses its
  #                                 output for the CAE cert binding). STILL REQUIRED for branch deploys
  #                                 (the bootstrap step needs the ID to attach the identity to the
  #                                 shared CAE before creating the cert resource).
  CERT_KEY_VAULT_SECRET_URL: ${{ vars.CERT_KEY_VAULT_SECRET_URL }}
  CERT_KEY_VAULT_CERT_NAME: ${{ vars.CERT_KEY_VAULT_CERT_NAME }}
  CERT_READER_IDENTITY_ID: ${{ vars.CERT_READER_IDENTITY_ID }}
  # Optional. Defaults to true when unset, but is consulted only by a
  # production BYO deployment that omits CERT_READER_IDENTITY_ID.
  MANAGE_ACMEBOT_PERMISSIONS: ${{ vars.MANAGE_ACMEBOT_PERMISSIONS }}

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore astervoids.sln

      - name: Build solution
        run: dotnet build astervoids.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test astervoids.sln --configuration Release --no-build --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run JavaScript tests
        run: node --test AstervoidsWeb/*.test.mjs

      - name: Validate workflow helpers
        run: bash .github/scripts/workflow-helpers.test.sh

      # Bicep smoke check — fail fast on template syntax errors before any
      # Azure deploy is attempted. Runs in the build job so a malformed
      # bicep change blocks the deploy job from even running.
      - name: Bicep build (template smoke check)
        run: |
          # az is preinstalled on ubuntu-latest runners; bicep CLI auto-installs on first use.
          az bicep build --file infra/main.bicep --outfile /tmp/main.compiled.json
          test -s /tmp/main.compiled.json
          echo "✅ infra/main.bicep compiles"

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      custom_subdomain_suffix: ${{ steps.vars.outputs.custom_subdomain_suffix }}
      custom_url_template: ${{ steps.vars.outputs.custom_url_template }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set deployment variables
        id: vars
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Sanitize branch name using shared script
          chmod +x .github/scripts/sanitize-branch-name.sh
          SANITIZED=$(.github/scripts/sanitize-branch-name.sh "$BRANCH_NAME")
          echo "sanitized_branch=$SANITIZED" >> $GITHUB_OUTPUT
          
          # Determine if this is production (main branch)
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "env_name=production" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "env_name=$SANITIZED" >> $GITHUB_OUTPUT
          fi

          # These values derive solely from the public branch name. Keep the
          # secret base subdomain and domain as literal placeholders because
          # job outputs and summaries are public.
          if [ "$BRANCH_NAME" = "main" ]; then
            CUSTOM_SUBDOMAIN_SUFFIX=""
          else
            CUSTOM_SUBDOMAIN_SUFFIX="-$SANITIZED"
          fi
          CUSTOM_URL_TEMPLATE="https://<CUSTOM_SUBDOMAIN>${CUSTOM_SUBDOMAIN_SUFFIX}.<CUSTOM_DOMAIN_NAME>"
          echo "custom_subdomain_suffix=$CUSTOM_SUBDOMAIN_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "custom_url_template=$CUSTOM_URL_TEMPLATE" >> "$GITHUB_OUTPUT"

      - name: Report custom-domain format
        env:
          CUSTOM_SUBDOMAIN_SUFFIX: ${{ steps.vars.outputs.custom_subdomain_suffix }}
          CUSTOM_URL_TEMPLATE: ${{ steps.vars.outputs.custom_url_template }}
        run: |
          echo "### Custom-domain format (safe template)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CUSTOM_SUBDOMAIN_SUFFIX" ]; then
            echo "**Custom subdomain suffix:** \`$CUSTOM_SUBDOMAIN_SUFFIX\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Custom subdomain suffix:** none (production uses the base subdomain)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "**Custom URL format:** \`$CUSTOM_URL_TEMPLATE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Replace the two literal placeholder tokens only in a private administrative environment; this is not a live endpoint." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Azure Developer CLI
        run: |
          curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register required Azure providers
        run: |
          # Register Microsoft.App provider (required for Container Apps)
          az provider register -n Microsoft.App --wait || true
          az provider register -n Microsoft.OperationalInsights --wait || true

      - name: Authenticate azd with federated credentials
        run: |
          azd auth login --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
                         --federated-credential-provider github \
                         --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Check production infrastructure (for branch deployments)
        if: steps.vars.outputs.is_production != 'true'
        run: |
          if ! az group show --name "${{ env.PRODUCTION_RG }}" &>/dev/null; then
            echo "::error::Production environment must be deployed first. Deploy main branch before deploying feature branches."
            exit 1
          fi

      - name: Set up azd environment
        run: |
          source .github/scripts/deployment-helpers.sh
          ENV_NAME="${{ steps.vars.outputs.env_name }}"
          if ! REGIONS_JSON=$(normalize_deployment_regions "$REGIONS_JSON"); then
            echo "::error::Refusing to select an Azure topology from invalid REGIONS_JSON."
            exit 1
          fi
          echo "REGIONS_JSON=$REGIONS_JSON" >> "$GITHUB_ENV"

          if { [ -n "${{ secrets.CUSTOM_DOMAIN_NAME }}" ] && [ -z "${{ secrets.CUSTOM_SUBDOMAIN }}" ]; } ||
            { [ -z "${{ secrets.CUSTOM_DOMAIN_NAME }}" ] && [ -n "${{ secrets.CUSTOM_SUBDOMAIN }}" ]; }; then
            echo "::error::CUSTOM_DOMAIN_NAME and CUSTOM_SUBDOMAIN must either both be configured or both be empty."
            exit 1
          fi
          if [ -n "${{ secrets.CUSTOM_DOMAIN_NAME }}" ]; then
            echo "HAS_CUSTOM_DOMAIN=true" >> "$GITHUB_ENV"
          else
            echo "HAS_CUSTOM_DOMAIN=false" >> "$GITHUB_ENV"
          fi
          if { [ -n "$CERT_KEY_VAULT_SECRET_URL" ] && [ -z "$CERT_KEY_VAULT_CERT_NAME" ]; } ||
            { [ -z "$CERT_KEY_VAULT_SECRET_URL" ] && [ -n "$CERT_KEY_VAULT_CERT_NAME" ]; }; then
            echo "::error::CERT_KEY_VAULT_SECRET_URL and CERT_KEY_VAULT_CERT_NAME must either both be configured or both be empty."
            exit 1
          fi
          if [ "${{ steps.vars.outputs.is_production }}" != "true" ] &&
            [ -n "${{ secrets.CUSTOM_DOMAIN_NAME }}" ] &&
            [ -n "$CERT_KEY_VAULT_SECRET_URL" ] &&
            [ -n "$CERT_KEY_VAULT_CERT_NAME" ] &&
            [ -z "$CERT_READER_IDENTITY_ID" ]; then
            echo "::error::Branch BYO certificate deployments require CERT_READER_IDENTITY_ID."
            exit 1
          fi
          if [ -z "${{ secrets.CUSTOM_DOMAIN_NAME }}" ] &&
            [ -n "$CERT_KEY_VAULT_SECRET_URL" ] &&
            [ -n "$CERT_KEY_VAULT_CERT_NAME" ]; then
            echo "::warning::BYO certificate inputs are ignored because no custom domain is configured."
            echo "### ⚠️ BYO certificate inputs ignored" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No custom domain is configured, so the supplied BYO certificate inputs will not create certificate or ACMEbot resources." >> "$GITHUB_STEP_SUMMARY"
          fi

          DEPLOYMENT_LOCATION=westus2
          if [ "$(jq 'length' <<< "$REGIONS_JSON")" -gt 0 ] &&
            [ -n "${{ secrets.CUSTOM_DOMAIN_NAME }}" ]; then
            DEPLOYMENT_LOCATION=$(primary_region_location "$REGIONS_JSON")
          fi
          
          # Create or select azd environment
          azd env new "$ENV_NAME" --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} --location "$DEPLOYMENT_LOCATION" || true
          azd env select "$ENV_NAME"
          
          # Branch previews use the existing primary CAE's location whenever
          # a regional production topology is configured.
          azd env set AZURE_LOCATION "$DEPLOYMENT_LOCATION"
          # Pass through region matrix so non-production shared-infra deploys
          # can resolve the primary shared CAE deterministically.
          azd env set REGIONS_JSON "${REGIONS_JSON:-[]}"
          
          # For branch deployments, set resource group to production's resource group
          # This tells azd deploy where to find the container app
          if [ "${{ steps.vars.outputs.is_production }}" != "true" ]; then
            azd env set AZURE_RESOURCE_GROUP "${{ env.PRODUCTION_RG }}"
            azd env set USE_SHARED_INFRA "true"
            # Tell azd which container app to deploy to (avoids tag collision with production)
            azd env set SERVICE_WEB_RESOURCE_NAME "${{ env.CONTAINER_APP_PREFIX }}-${{ steps.vars.outputs.sanitized_branch }}"
          else
            azd env set USE_SHARED_INFRA "false"
          fi
          
          # Write both values even when empty so restored azd environments
          # cannot retain a removed custom-domain configuration.
          azd env set CUSTOM_DOMAIN_NAME "${{ secrets.CUSTOM_DOMAIN_NAME }}"
          
          # Set subdomain (with branch suffix for non-production)
          if [ "${{ steps.vars.outputs.is_production }}" = "true" ]; then
            azd env set CUSTOM_SUBDOMAIN "${{ secrets.CUSTOM_SUBDOMAIN }}"
          elif [ -n "${{ secrets.CUSTOM_SUBDOMAIN }}" ]; then
            azd env set CUSTOM_SUBDOMAIN "${{ secrets.CUSTOM_SUBDOMAIN }}-${{ steps.vars.outputs.sanitized_branch }}"
          else
            azd env set CUSTOM_SUBDOMAIN ""
          fi

          # Seed DOMAIN_VERIFICATION_ID so bicep can emit asuid TXT before
          # branch custom hostname binding is attempted. Azure validates
          # ownership during app create; missing asuid causes
          # InvalidCustomHostNameValidation failures.
          azd env set DOMAIN_VERIFICATION_ID ""
          if [ -n "${{ secrets.CUSTOM_DOMAIN_NAME }}" ]; then
            PRIMARY_REGION_NAME=$(primary_region_name "$REGIONS_JSON")
            SHARED_CAE_NAME=$(shared_container_environment "$REGIONS_JSON" "$CONTAINER_ENV_NAME")
            DOMAIN_VERIFICATION_ID=$(resolve_domain_verification_id \
              "${{ env.PRODUCTION_RG }}" \
              "ca-web-production-${PRIMARY_REGION_NAME}" \
              "ca-web-production" \
              "${{ env.CONTAINER_APP_PREFIX }}-${{ steps.vars.outputs.sanitized_branch }}" \
              -- "$SHARED_CAE_NAME")
            if [ -n "$DOMAIN_VERIFICATION_ID" ]; then
              azd env set DOMAIN_VERIFICATION_ID "$DOMAIN_VERIFICATION_ID"
            else
              echo "::warning::Could not resolve customDomainVerificationId from existing container apps."
            fi

            # BYO + branch custom hostname needs the asuid token up-front.
            if [ "${{ steps.vars.outputs.is_production }}" != "true" ] \
              && [ -n "$CERT_KEY_VAULT_SECRET_URL" ] \
              && [ -n "$CERT_KEY_VAULT_CERT_NAME" ] \
              && [ -n "$CERT_READER_IDENTITY_ID" ] \
              && [ -z "$DOMAIN_VERIFICATION_ID" ]; then
              echo "::error::Branch BYO custom-domain deploy requires DOMAIN_VERIFICATION_ID, but none was found."
              echo "::error::Resolve by ensuring at least one container app exists in ${{ env.PRODUCTION_RG }} and exposes properties.customDomainVerificationId."
              exit 1
            fi
          fi

          # BYO TLS cert (optional) — passed through to bicep when all three
          # vars are set. azd reads these via main.parameters.json env-var
          # substitution (see infra/main.parameters.json). Write empty values too
          # so a restored azd environment cannot retain removed CI certificate inputs.
          azd env set CERT_KEY_VAULT_SECRET_URL "$CERT_KEY_VAULT_SECRET_URL"
          azd env set CERT_KEY_VAULT_CERT_NAME "$CERT_KEY_VAULT_CERT_NAME"
          azd env set CERT_READER_IDENTITY_ID "$CERT_READER_IDENTITY_ID"
          azd env set MANAGE_ACMEBOT_PERMISSIONS "${MANAGE_ACMEBOT_PERMISSIONS:-true}"

      - name: Bootstrap BYO cert on shared CAE (branches only)
        # Production owns the CAE in Bicep. Branches reference it as existing,
        # so attach the identity and ensure its KV-backed certificate separately.
        if: steps.vars.outputs.is_production != 'true' && env.HAS_CUSTOM_DOMAIN == 'true' && env.CERT_KEY_VAULT_SECRET_URL != '' && env.CERT_KEY_VAULT_CERT_NAME != '' && env.CERT_READER_IDENTITY_ID != ''
        run: |
          source .github/scripts/deployment-helpers.sh
          CAE_NAME=$(shared_container_environment "$REGIONS_JSON" "$CONTAINER_ENV_NAME")
          bootstrap_shared_certificate "$PRODUCTION_RG" "$CAE_NAME" "$AZURE_SUBSCRIPTION_ID" \
            "$CERT_KEY_VAULT_SECRET_URL" "$CERT_KEY_VAULT_CERT_NAME" "$CERT_READER_IDENTITY_ID"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision and Deploy to Azure
        id: deploy
        shell: bash
        run: |
          source .github/scripts/deployment-helpers.sh
          declare -A deployment=(
            [runId]="$GITHUB_RUN_ID"
            [imageTag]="$GITHUB_SHA"
            [resourceGroup]="$PRODUCTION_RG"
            [appPrefix]="$CONTAINER_APP_PREFIX"
            [environmentPrefix]="$CONTAINER_ENV_NAME"
            [staticDir]="$GITHUB_WORKSPACE/.deploy/static-apex"
          )
          declare -A outputs=()
          load_deployment_settings deployment
          MODE=$(deployment_mode "${{ steps.vars.outputs.is_production }}" "${deployment[regions]}")
          case "$MODE" in
            single-region) deploy_single_region_production deployment outputs ;;
            multi-region) deploy_multi_region_production deployment outputs ;;
            branch) deploy_shared_infra_branch deployment outputs ;;
          esac
          write_deployment_outputs outputs "$GITHUB_OUTPUT" "$GITHUB_ENV"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get static apex deploy token (multi-region)
        id: swa_publish
        if: steps.vars.outputs.is_production == 'true' && env.IS_MULTI_REGION == 'true' && env.STATIC_WEB_APP_NAME != ''
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "${{ env.PRODUCTION_RG }}" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to fetch Static Web App deployment token via az staticwebapp secrets list."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "api_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Publish static apex payload (multi-region)
        if: steps.vars.outputs.is_production == 'true' && env.IS_MULTI_REGION == 'true' && env.STATIC_WEB_APP_NAME != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: ${{ steps.deploy.outputs.static_deploy_dir }}
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ steps.swa_publish.outputs.api_token }}

      - name: Bind static apex custom hostname (multi-region)
        if: steps.vars.outputs.is_production == 'true' && env.IS_MULTI_REGION == 'true' && env.CUSTOM_DOMAIN != '' && env.STATIC_WEB_APP_NAME != ''
        run: |
          SWA_NAME="$STATIC_WEB_APP_NAME"
          echo "Binding static apex hostname '$CUSTOM_DOMAIN' on '$SWA_NAME'."
          MAX_RETRIES=20
          for attempt in $(seq 1 $MAX_RETRIES); do
            status=$(az staticwebapp hostname show \
              --name "$SWA_NAME" \
              --resource-group "${{ env.PRODUCTION_RG }}" \
              --hostname "$CUSTOM_DOMAIN" \
              --query "status" -o tsv 2>/dev/null || echo "")
            if [ "$status" = "Ready" ]; then
              echo "✅ Static apex hostname is Ready"
              exit 0
            fi

            echo "Attempt $attempt/$MAX_RETRIES: ensure hostname binding exists (current status: ${status:-missing})"
            az staticwebapp hostname set \
              --name "$SWA_NAME" \
              --resource-group "${{ env.PRODUCTION_RG }}" \
              --hostname "$CUSTOM_DOMAIN" \
              --no-wait \
              --output none || true

            sleep 20
          done

          final_status=$(az staticwebapp hostname show \
            --name "$SWA_NAME" \
            --resource-group "${{ env.PRODUCTION_RG }}" \
            --hostname "$CUSTOM_DOMAIN" \
            --query "status" -o tsv 2>/dev/null || echo "missing")
          echo "::error::Static apex hostname did not reach Ready. Final status: $final_status"
          exit 1

      - name: Configure Custom Domain (if enabled)
        id: managed_domain
        # Runs ONLY for single-region production WITHOUT BYO cert vars.
        # All other cases are handled in-band by bicep + the bootstrap step:
        #   - Single-region production WITH BYO    → bicep binds via SNI.
        #   - Multi-region production              → bicep + static-apex publish
        #                                            steps above (no ACA managed-cert flow).
        #   - Branches WITH BYO                    → bootstrap step (above)
        #                                            ensures cert + identity on
        #                                            the shared CAE; bicep then
        #                                            binds the branch hostname
        #                                            via SNI. ~5 min saved vs
        #                                            the legacy managed-cert flow.
        #   - Branches WITHOUT BYO                 → this step runs, the
        #                                            legacy DigiCert flow
        #                                            creates + binds a managed
        #                                            cert per branch.
        if: env.CUSTOM_DOMAIN != '' && env.IS_MULTI_REGION != 'true' && env.CERT_KEY_VAULT_SECRET_URL == ''
        continue-on-error: true
        run: bash .github/scripts/configure-managed-domain.sh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Report managed custom-domain activation
        if: always() && env.CUSTOM_DOMAIN != '' && env.IS_MULTI_REGION != 'true' && env.CERT_KEY_VAULT_SECRET_URL == ''
        run: |
          if [ "${{ steps.managed_domain.outputs.custom_domain_ready }}" != "true" ]; then
            echo "### ⚠️ Custom-domain activation pending" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The Azure deployment is available at its default Azure hostname, but managed-certificate binding is not ready yet." >> $GITHUB_STEP_SUMMARY
            echo "Review the Configure Custom Domain step and rerun after DNS propagation completes." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Deployment Summary
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.vars.outputs.is_production }}" = "true" ]; then
            echo "**Environment:** production" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Environment:** preview (${{ steps.vars.outputs.branch_name }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Application URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CUSTOM_DOMAIN" ]; then
            # SECURITY: job summaries are NOT secret-masked (only logs are), and
            # this repo is public. The custom hostname embeds the secret
            # CUSTOM_SUBDOMAIN/CUSTOM_DOMAIN_NAME (apex for production, suffixed for
            # branches), so printing it here would publicly correlate this repo to
            # the live deployment. Never emit it — resolve it privately instead with
            # .github/scripts/branch-url.sh.
            echo "**Custom domain:** configured (private — run \`.github/scripts/branch-url.sh\` locally to resolve)" >> $GITHUB_STEP_SUMMARY
          fi

          # Multi-region: list per-region container apps + static apex host info
          # so reviewers can spot-check each endpoint from the summary.
          if [ "$IS_MULTI_REGION" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Multi-region rollout:** $(echo "$REGIONS_JSON" | jq 'length') regions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Region | Container App | FQDN |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|---------------|------|" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' "$REGION_ENDPOINTS" \
              | jq -r '.[] | select(.fqdn | test("^[a-zA-Z0-9.-]+\\.azurecontainerapps\\.io$")) |
                "| \(.displayName) (\(.id)) | \(.containerAppName) | https://\(.fqdn) |"' \
              >> $GITHUB_STEP_SUMMARY
            SWA_FQDN="${{ steps.deploy.outputs.static_web_app_default_hostname }}"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Static apex default host:** \`$SWA_FQDN\` (apex CNAME target)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View your deployment in the [Azure Portal](https://portal.azure.com)" >> $GITHUB_STEP_SUMMARY
