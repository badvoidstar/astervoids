name: Azure CICD

on:
  push:
    branches:
      - '**'  # All branches
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:  # Allow manual trigger

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  # Shared resource naming conventions
  PRODUCTION_RG: 'rg-production'
  CONTAINER_ENV_NAME: 'cae-production'
  CONTAINER_APP_PREFIX: 'ca-web'
  # ── Multi-region rollout ──────────────────────────────────────────────────
  # Source of truth: the GitHub repository variable REGIONS_JSON
  # (Settings → Secrets and variables → Actions → Variables tab).
  # Empty string preserves the legacy single-region production deploy
  # (everything in westus2 under cae-production). To roll out multi-region,
  # set the REGIONS_JSON repo variable to a JSON array of region objects:
  #
  #   [
  #     {"name":"westus2","location":"westus2","displayName":"US West"},
  #     {"name":"northeurope","location":"northeurope","displayName":"Europe (Dublin)"},
  #     {"name":"japaneast","location":"japaneast","displayName":"Asia (Tokyo)"}
  #   ]
  #
  # The first entry is the "primary" region — it owns the shared ACR and
  # branch deployments target its CAE. Only applied when deploying main;
  # branches always go single-region into the primary region's CAE.
  REGIONS_JSON: ${{ vars.REGIONS_JSON }}
  # ── BYO TLS certificate (optional) ────────────────────────────────────────
  # When all three are set, bicep binds <subdomain>.<domain> on every region
  # (and every branch deploy) to a Key Vault-stored certificate — no per-app
  # DigiCert managed-cert provisioning runs. Recommended path for multi-region
  # where the apex CNAME must point at Traffic Manager (which blocks ACA
  # managed-cert validation). See ARCHITECTURE.md "Apex TLS via BYO cert".
  #
  # When ANY is empty, falls back to the legacy DigiCert managed-cert flow
  # (works in single-region only; multi-region apex TLS will fail).
  #
  # Set via repo variables (Settings → Secrets and variables → Actions → Variables):
  #   CERT_KEY_VAULT_SECRET_URL    e.g. https://my-kv.vault.azure.net/secrets/wildcard-your-domain-com
  #   CERT_KEY_VAULT_CERT_NAME     e.g. wildcard-your-domain-com (stable name for the CAE cert resource)
  #   CERT_READER_IDENTITY_ID      resource ID of a user-assigned managed identity that has
  #                                 'Key Vault Certificate User' role on the KV holding the cert
  CERT_KEY_VAULT_SECRET_URL: ${{ vars.CERT_KEY_VAULT_SECRET_URL }}
  CERT_KEY_VAULT_CERT_NAME: ${{ vars.CERT_KEY_VAULT_CERT_NAME }}
  CERT_READER_IDENTITY_ID: ${{ vars.CERT_READER_IDENTITY_ID }}

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore astervoids.sln

      - name: Build solution
        run: dotnet build astervoids.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test astervoids.sln --configuration Release --no-build --verbosity normal

      # Bicep smoke check — fail fast on template syntax errors before any
      # Azure deploy is attempted. Runs in the build job so a malformed
      # bicep change blocks the deploy job from even running.
      - name: Bicep build (template smoke check)
        run: |
          # az is preinstalled on ubuntu-latest runners; bicep CLI auto-installs on first use.
          az bicep build --file infra/main.bicep --outfile /tmp/main.compiled.json
          test -s /tmp/main.compiled.json
          echo "✅ infra/main.bicep compiles"

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Sanitize branch name using shared script
          chmod +x .github/scripts/sanitize-branch-name.sh
          SANITIZED=$(.github/scripts/sanitize-branch-name.sh "$BRANCH_NAME")
          echo "sanitized_branch=$SANITIZED" >> $GITHUB_OUTPUT
          
          # Determine if this is production (main branch)
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "env_name=production" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "env_name=$SANITIZED" >> $GITHUB_OUTPUT
          fi

      - name: Install Azure Developer CLI
        run: |
          curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register required Azure providers
        run: |
          # Register Microsoft.App provider (required for Container Apps)
          az provider register -n Microsoft.App --wait || true
          az provider register -n Microsoft.OperationalInsights --wait || true

      - name: Authenticate azd with federated credentials
        run: |
          azd auth login --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
                         --federated-credential-provider github \
                         --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Check production infrastructure (for branch deployments)
        if: steps.vars.outputs.is_production != 'true'
        run: |
          if ! az group show --name "${{ env.PRODUCTION_RG }}" &>/dev/null; then
            echo "::error::Production environment must be deployed first. Deploy main branch before deploying feature branches."
            exit 1
          fi

      - name: Set up azd environment
        run: |
          ENV_NAME="${{ steps.vars.outputs.env_name }}"
          
          # Create or select azd environment
          azd env new "$ENV_NAME" --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }} --location westus2 || true
          azd env select "$ENV_NAME"
          
          # Set location
          azd env set AZURE_LOCATION westus2
          
          # For branch deployments, set resource group to production's resource group
          # This tells azd deploy where to find the container app
          if [ "${{ steps.vars.outputs.is_production }}" != "true" ]; then
            azd env set AZURE_RESOURCE_GROUP "${{ env.PRODUCTION_RG }}"
            azd env set USE_SHARED_INFRA "true"
            # Tell azd which container app to deploy to (avoids tag collision with production)
            azd env set SERVICE_WEB_RESOURCE_NAME "${{ env.CONTAINER_APP_PREFIX }}-${{ steps.vars.outputs.sanitized_branch }}"
          fi
          
          # Set custom domain from secrets (if provided)
          if [ -n "${{ secrets.CUSTOM_DOMAIN_NAME }}" ]; then
            azd env set CUSTOM_DOMAIN_NAME "${{ secrets.CUSTOM_DOMAIN_NAME }}"
          fi
          
          # Set subdomain (with branch suffix for non-production)
          if [ -n "${{ secrets.CUSTOM_SUBDOMAIN }}" ]; then
            if [ "${{ steps.vars.outputs.is_production }}" = "true" ]; then
              azd env set CUSTOM_SUBDOMAIN "${{ secrets.CUSTOM_SUBDOMAIN }}"
            else
              azd env set CUSTOM_SUBDOMAIN "${{ secrets.CUSTOM_SUBDOMAIN }}-${{ steps.vars.outputs.sanitized_branch }}"
            fi
          fi

          # BYO TLS cert (optional) — passed through to bicep when all three
          # vars are set. azd reads these via main.parameters.json env-var
          # substitution (see infra/main.parameters.json).
          if [ -n "$CERT_KEY_VAULT_SECRET_URL" ]; then
            azd env set CERT_KEY_VAULT_SECRET_URL "$CERT_KEY_VAULT_SECRET_URL"
            azd env set CERT_KEY_VAULT_CERT_NAME "$CERT_KEY_VAULT_CERT_NAME"
            azd env set CERT_READER_IDENTITY_ID "$CERT_READER_IDENTITY_ID"
          fi

      - name: Provision and Deploy to Azure
        id: deploy
        run: |
          IS_PRODUCTION="${{ steps.vars.outputs.is_production }}"
          SANITIZED_BRANCH="${{ steps.vars.outputs.sanitized_branch }}"
          # ── Multi-region detection ────────────────────────────────────────
          # Only the main branch (production) can be multi-region. Branches
          # always deploy single-region into the primary region's CAE.
          # REGIONS_JSON is parsed once here so the script can branch on
          # `IS_MULTI_REGION` without re-parsing.
          IS_MULTI_REGION="false"
          if [ "$IS_PRODUCTION" = "true" ] && [ -n "$REGIONS_JSON" ]; then
            # Validate it's a non-empty JSON array; fail loudly if it isn't.
            REGION_COUNT=$(echo "$REGIONS_JSON" | jq 'length' 2>/dev/null || echo "0")
            if [ "$REGION_COUNT" -gt 0 ] 2>/dev/null; then
              IS_MULTI_REGION="true"
              echo "::notice::Multi-region production deploy: $REGION_COUNT regions"
            else
              echo "::warning::REGIONS_JSON is set but did not parse as a non-empty array. Falling back to single-region."
            fi
          fi

          if [ "$IS_PRODUCTION" = "true" ] && [ "$IS_MULTI_REGION" = "false" ]; then
            # Production single-region (legacy): use azd up for full provision + deploy
            azd up --no-prompt
          elif [ "$IS_MULTI_REGION" = "true" ]; then
            # ── Production multi-region ───────────────────────────────────
            # We bypass `azd up` because azd doesn't know about per-region
            # container apps. Instead:
            #   1. Run bicep directly with regions=<JSON>, which provisions
            #      per-region CAEs + container apps + Traffic Manager.
            #   2. Build the Docker image once.
            #   3. Push it to the shared ACR.
            #   4. Update each region's container app to point at the new image.
            # Each region's container app already has Region__Id env var
            # baked in by the bicep template; only the image tag changes
            # on subsequent deploys.
            CD_NAME=$(azd env get-values | grep '^CUSTOM_DOMAIN_NAME=' | cut -d'=' -f2 | tr -d '"' || echo "")
            CD_SUB=$(azd env get-values | grep '^CUSTOM_SUBDOMAIN=' | cut -d'=' -f2 | tr -d '"' || echo "")
            PRIMARY_LOCATION=$(echo "$REGIONS_JSON" | jq -r '.[0].location')

            echo "Provisioning multi-region production via bicep (primary: $PRIMARY_LOCATION)"
            az deployment sub create \
              --name "production-multi-${{ github.run_id }}" \
              --location "$PRIMARY_LOCATION" \
              --template-file infra/main.bicep \
              --parameters \
                environmentName=production \
                location="$PRIMARY_LOCATION" \
                customDomainName="$CD_NAME" \
                customSubdomain="$CD_SUB" \
                regions="$REGIONS_JSON" \
                certKeyVaultSecretUrl="$CERT_KEY_VAULT_SECRET_URL" \
                certKeyVaultCertName="$CERT_KEY_VAULT_CERT_NAME" \
                certReaderIdentityId="$CERT_READER_IDENTITY_ID" \
              --output none

            # Get the shared ACR name from the deployment outputs.
            ACR_NAME=$(az deployment sub show \
              --name "production-multi-${{ github.run_id }}" \
              --query 'properties.outputs.AZURE_CONTAINER_REGISTRY_NAME.value' -o tsv)
            ACR_LOGIN_SERVER=$(az deployment sub show \
              --name "production-multi-${{ github.run_id }}" \
              --query 'properties.outputs.AZURE_CONTAINER_REGISTRY_ENDPOINT.value' -o tsv)

            IMAGE_TAG="${{ github.sha }}"
            IMAGE_NAME="astervoids-web:${IMAGE_TAG}"
            FULL_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}"

            echo "Building and pushing image: $FULL_IMAGE"
            az acr login --name "$ACR_NAME"
            docker build -t "$FULL_IMAGE" ./AstervoidsWeb
            docker push "$FULL_IMAGE"

            # Update every region's container app with the new image.
            echo "$REGIONS_JSON" | jq -r '.[].name' | while read -r REGION_NAME; do
              CONTAINER_APP_NAME="${{ env.CONTAINER_APP_PREFIX }}-production-${REGION_NAME}"
              echo "::group::Updating $CONTAINER_APP_NAME ($REGION_NAME)"
              az containerapp update \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "${{ env.PRODUCTION_RG }}" \
                --image "$FULL_IMAGE" \
                --output table
              echo "::endgroup::"
            done

            # Surface Traffic Manager FQDN + per-region details in the run log.
            echo "Traffic Manager FQDN: $(az deployment sub show \
              --name "production-multi-${{ github.run_id }}" \
              --query 'properties.outputs.TRAFFIC_MANAGER_FQDN.value' -o tsv)"
            echo "Per-region endpoints:"
            az deployment sub show \
              --name "production-multi-${{ github.run_id }}" \
              --query 'properties.outputs.REGION_ENDPOINTS.value' -o jsonc

            # Use the primary region's URI as the canonical deploy URL.
            azd env set WEB_URI "$(az deployment sub show \
              --name "production-multi-${{ github.run_id }}" \
              --query 'properties.outputs.WEB_URI.value' -o tsv)"
            azd env set CONTAINER_APP_NAME "${{ env.CONTAINER_APP_PREFIX }}-production-$(echo "$REGIONS_JSON" | jq -r '.[0].name')"
            azd env set CONTAINER_APPS_ENVIRONMENT "${{ env.CONTAINER_ENV_NAME }}-$(echo "$REGIONS_JSON" | jq -r '.[0].name')"
            azd env set RESOURCE_GROUP "${{ env.PRODUCTION_RG }}"
          else
            # Branch: provision with azd, then deploy with az cli to specific container app
            # First, provision the infrastructure
            azd provision --no-prompt

            # Defensive check: `azd provision --no-prompt` can falsely report
            # "no changes" for branch deploys when a prior branch's truncated
            # 20-char sanitized env name matches this one (azd's deployment
            # state is keyed on env name, not on the actual resources). When
            # that happens, our branch's container app is silently NOT created
            # and the subsequent `az containerapp update` fails with
            # "The containerapp '...' does not exist". Verify the expected app
            # exists in the production resource group; if not, force a direct
            # bicep deployment to create it.
            EXPECTED_APP="${{ env.CONTAINER_APP_PREFIX }}-${SANITIZED_BRANCH}"
            if ! az containerapp show \
                  --name "$EXPECTED_APP" \
                  --resource-group "${{ env.PRODUCTION_RG }}" \
                  &>/dev/null; then
              echo "::warning::Container app '$EXPECTED_APP' missing after azd provision (likely the env-name truncation collision in azd's deployment state). Forcing a direct bicep deployment to create it."

              CD_NAME=$(azd env get-values | grep '^CUSTOM_DOMAIN_NAME=' | cut -d'=' -f2 | tr -d '"' || echo "")
              CD_SUB=$(azd env get-values | grep '^CUSTOM_SUBDOMAIN=' | cut -d'=' -f2 | tr -d '"' || echo "")

              az deployment sub create \
                --name "fallback-${SANITIZED_BRANCH}-${{ github.run_id }}" \
                --location westus2 \
                --template-file infra/main.bicep \
                --parameters \
                  environmentName="${SANITIZED_BRANCH}" \
                  location=westus2 \
                  useSharedInfra=true \
                  customDomainName="$CD_NAME" \
                  customSubdomain="$CD_SUB" \
                  certKeyVaultSecretUrl="$CERT_KEY_VAULT_SECRET_URL" \
                  certKeyVaultCertName="$CERT_KEY_VAULT_CERT_NAME" \
                  certReaderIdentityId="$CERT_READER_IDENTITY_ID"

              # Re-verify after the fallback deployment.
              if ! az containerapp show \
                    --name "$EXPECTED_APP" \
                    --resource-group "${{ env.PRODUCTION_RG }}" \
                    &>/dev/null; then
                echo "::error::Container app '$EXPECTED_APP' still missing after fallback bicep deployment. Aborting."
                exit 1
              fi
            fi

            # Get the container registry name from azd outputs
            ACR_NAME=$(azd env get-values | grep '^AZURE_CONTAINER_REGISTRY_NAME=' | cut -d'=' -f2 | tr -d '"')
            ACR_LOGIN_SERVER=$(azd env get-values | grep '^AZURE_CONTAINER_REGISTRY_ENDPOINT=' | cut -d'=' -f2 | tr -d '"')
            
            # Build and push image using Docker
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_NAME="astervoids-web:${IMAGE_TAG}"
            FULL_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}"
            
            echo "Building and pushing image: $FULL_IMAGE"
            
            # Login to ACR
            az acr login --name "$ACR_NAME"
            
            # Build and push
            docker build -t "$FULL_IMAGE" ./AstervoidsWeb
            docker push "$FULL_IMAGE"
            
            # Update the specific branch container app with the new image
            CONTAINER_APP_NAME="${{ env.CONTAINER_APP_PREFIX }}-${SANITIZED_BRANCH}"
            echo "Deploying to container app: $CONTAINER_APP_NAME"
            
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "${{ env.PRODUCTION_RG }}" \
              --image "$FULL_IMAGE"
          fi
          
          # Get outputs from azd
          DEPLOY_URL=$(azd env get-values | grep '^WEB_URI=' | cut -d'=' -f2 | tr -d '"')
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          
          # Export values for custom domain step
          echo "CONTAINER_APP_NAME=$(azd env get-values | grep '^CONTAINER_APP_NAME=' | cut -d'=' -f2 | tr -d '\"')" >> $GITHUB_ENV
          echo "CONTAINER_APPS_ENVIRONMENT=$(azd env get-values | grep '^CONTAINER_APPS_ENVIRONMENT=' | cut -d'=' -f2 | tr -d '\"')" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=$(azd env get-values | grep '^RESOURCE_GROUP=' | cut -d'=' -f2 | tr -d '\"')" >> $GITHUB_ENV
          echo "IS_MULTI_REGION=${IS_MULTI_REGION}" >> $GITHUB_ENV

          # Get custom domain from azd outputs
          CUSTOM_DOMAIN=$(azd env get-values | grep '^CUSTOM_DOMAIN=' | cut -d'=' -f2 | tr -d '"')
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "CUSTOM_DOMAIN=$CUSTOM_DOMAIN" >> $GITHUB_ENV
          fi
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Custom Domain (if enabled)
        # Single-region: binds CUSTOM_DOMAIN to the one container app with
        # CNAME-based cert validation (CNAME points directly at the container
        # app FQDN, so Azure can confirm ownership trivially).
        #
        # Multi-region: the same CUSTOM_DOMAIN is bound to EVERY region's
        # container app, with TXT-based cert validation (CNAME points at the
        # Traffic Manager profile FQDN, not at any single container app —
        # so CNAME validation would always fail; bicep emits an asuid TXT
        # record with one customDomainVerificationId per region so every
        # region's managed cert can independently validate).
        #
        # BYO cert (CERT_KEY_VAULT_SECRET_URL set): bicep already bound the
        # hostname with SniEnabled + the KV cert during provision. This step
        # is a no-op — skipped via the env-var guard below.
        if: env.CUSTOM_DOMAIN != '' && env.CERT_KEY_VAULT_SECRET_URL == ''
        continue-on-error: true
        run: |
          echo "Configuring custom domain: $CUSTOM_DOMAIN (IS_MULTI_REGION=${IS_MULTI_REGION})"

          # Build the (region_label, env_name, container_app_name) tuples to
          # bind. Single-region: one tuple from the workflow's
          # CONTAINER_APPS_ENVIRONMENT / CONTAINER_APP_NAME env vars.
          # Multi-region: one tuple per region in REGIONS_JSON.
          if [ "$IS_MULTI_REGION" = "true" ]; then
            VALIDATION_METHOD="TXT"
            TARGETS=()
            while read -r REGION_NAME; do
              TARGETS+=("${REGION_NAME}|cae-production-${REGION_NAME}|ca-web-production-${REGION_NAME}")
            done < <(echo "$REGIONS_JSON" | jq -r '.[].name')
            echo "Multi-region: will bind $CUSTOM_DOMAIN to ${#TARGETS[@]} container apps with TXT validation"
          else
            VALIDATION_METHOD="CNAME"
            TARGETS=("single|${CONTAINER_APPS_ENVIRONMENT}|${CONTAINER_APP_NAME}")
            echo "Single-region: will bind $CUSTOM_DOMAIN to $CONTAINER_APP_NAME with CNAME validation"
          fi

          # ── DNS propagation probe (shared across all regions) ──────────
          # The same DNS records back every region's binding; we only need
          # to probe once before kicking off per-region work.
          check_dns() {
            echo "Checking DNS propagation for $CUSTOM_DOMAIN..."
            CNAME_RESULT=$(nslookup "$CUSTOM_DOMAIN" 2>/dev/null | grep -i "canonical name" || echo "")
            TXT_RESULT=$(nslookup -type=TXT "asuid.$CUSTOM_DOMAIN" 2>/dev/null | grep -i "text" || echo "")
            if [ -n "$CNAME_RESULT" ] && [ -n "$TXT_RESULT" ]; then
              echo "✅ DNS records found"
              return 0
            else
              echo "⏳ DNS not yet propagated (CNAME: ${CNAME_RESULT:-not found}, TXT: ${TXT_RESULT:-not found})"
              return 1
            fi
          }

          # ── Per-region bind/cert/attach (idempotent) ──────────────────
          # Returns 0 on success (hostname bound with HTTPS) or 1 on
          # transient failure (caller retries via the outer attempt loop).
          # Idempotent: skips work when the hostname is already SniEnabled
          # or the managed cert already exists.
          bind_one() {
            local label="$1"
            local env_name="$2"
            local app_name="$3"
            local rg="${PRODUCTION_RG}"

            echo "::group::Binding $CUSTOM_DOMAIN on $app_name ($label)"

            # Fast path: already SniEnabled means the cert is bound and
            # serving HTTPS — no work to do.
            local existing_binding
            existing_binding=$(az containerapp hostname list \
              --resource-group "$rg" \
              --name "$app_name" \
              --query "[?name=='$CUSTOM_DOMAIN'].bindingType" -o tsv 2>/dev/null || echo "")
            if [ "$existing_binding" = "SniEnabled" ]; then
              echo "✅ Already SniEnabled — skipping"
              echo "::endgroup::"
              return 0
            fi

            # Add custom hostname (unbound first; validation happens during cert create).
            local hostname_exists
            hostname_exists=$(az containerapp hostname list \
              --resource-group "$rg" --name "$app_name" \
              --query "[?name=='$CUSTOM_DOMAIN'].name" -o tsv 2>/dev/null || echo "")
            if [ -z "$hostname_exists" ]; then
              echo "Adding custom hostname..."
              if ! az containerapp hostname add \
                --resource-group "$rg" --name "$app_name" \
                --hostname "$CUSTOM_DOMAIN" 2>&1; then
                echo "::warning::Failed to add hostname on $app_name"
                echo "::endgroup::"
                return 1
              fi
            else
              echo "Hostname already exists, skipping add..."
            fi

            # Create managed cert (per-environment resource; each region
            # has its own CAE so its own cert resource).
            local cert_name="cert-${CUSTOM_DOMAIN//./-}"
            local cert_exists
            cert_exists=$(az containerapp env certificate list \
              --resource-group "$rg" --name "$env_name" \
              --query "[?name=='$cert_name'].name" -o tsv 2>/dev/null || echo "")
            if [ -z "$cert_exists" ]; then
              echo "Creating managed certificate (validation: $VALIDATION_METHOD)..."
              if ! az containerapp env certificate create \
                --resource-group "$rg" --name "$env_name" \
                --certificate-name "$cert_name" \
                --hostname "$CUSTOM_DOMAIN" \
                --validation-method "$VALIDATION_METHOD" 2>&1; then
                echo "::warning::Failed to create certificate on $env_name"
                echo "::endgroup::"
                return 1
              fi
            fi

            # Wait for cert provisioning (up to 5 minutes).
            local cert_id="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$rg/providers/Microsoft.App/managedEnvironments/$env_name/managedCertificates/$cert_name"
            local cert_ready=false
            for i in $(seq 1 30); do
              local state
              state=$(az resource show --ids "$cert_id" --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
              echo "[$label] cert state: $state (check $i/30)"
              if [ "$state" = "Succeeded" ]; then
                cert_ready=true
                break
              elif [ "$state" = "Failed" ]; then
                echo "::warning::Cert provisioning Failed on $env_name"
                break
              fi
              sleep 10
            done

            if [ "$cert_ready" = "true" ]; then
              echo "Binding certificate..."
              if az containerapp hostname bind \
                --resource-group "$rg" --name "$app_name" \
                --hostname "$CUSTOM_DOMAIN" \
                --environment "$env_name" \
                --validation-method "$VALIDATION_METHOD" 2>&1; then
                echo "✅ HTTPS enabled for $CUSTOM_DOMAIN on $app_name"
                echo "::endgroup::"
                return 0
              fi
            fi

            echo "::warning::Cert not ready / bind failed for $app_name"
            echo "::endgroup::"
            return 1
          }

          # ── Outer attempt loop ─────────────────────────────────────────
          MAX_RETRIES=3
          RETRY_DELAY=120
          OVERALL_SUCCESS=true

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "=========================================="
            echo "Custom domain setup attempt $attempt of $MAX_RETRIES"
            echo "=========================================="

            # Wait for DNS propagation before attempting (skip wait on
            # first attempt if DNS is already propagated).
            if [ $attempt -gt 1 ] || ! check_dns; then
              if [ $attempt -gt 1 ]; then
                WAIT_TIME=$((RETRY_DELAY * (attempt - 1)))
                echo "Waiting ${WAIT_TIME}s before retry..."
                sleep $WAIT_TIME
              fi
              if ! check_dns; then
                echo "DNS not propagated yet, will retry..."
                if [ $attempt -eq $MAX_RETRIES ]; then
                  echo "::warning::DNS not propagated after $MAX_RETRIES attempts. Custom domain setup incomplete."
                  exit 0
                fi
                continue
              fi
            fi

            # Per-region binding — accumulate failures across targets so
            # one slow region doesn't abort the others.
            OVERALL_SUCCESS=true
            for tuple in "${TARGETS[@]}"; do
              IFS='|' read -r region_label env_name app_name <<< "$tuple"
              if ! bind_one "$region_label" "$env_name" "$app_name"; then
                OVERALL_SUCCESS=false
              fi
            done

            if [ "$OVERALL_SUCCESS" = "true" ]; then
              echo "✅ All targets bound on attempt $attempt"
              exit 0
            fi
            echo "One or more targets failed on attempt $attempt; will retry..."
          done

          echo "::warning::Custom domain setup incomplete after $MAX_RETRIES attempts."
          echo "The deployment succeeded but HTTPS is not yet configured on every region."
          echo "Usually resolves on the next deployment after DNS propagates."

      - name: Deployment Summary
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.vars.outputs.is_production }}" = "true" ]; then
            echo "**Environment:** production" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Environment:** preview (${{ steps.vars.outputs.branch_name }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Application URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "**Custom Domain:** https://$CUSTOM_DOMAIN" >> $GITHUB_STEP_SUMMARY
          fi

          # Multi-region: list per-region container apps + Traffic Manager FQDN
          # so reviewers can spot-check each regional endpoint from the summary.
          if [ "$IS_MULTI_REGION" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Multi-region rollout:** $(echo "$REGIONS_JSON" | jq 'length') regions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Region | Container App | FQDN |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|---------------|------|" >> $GITHUB_STEP_SUMMARY
            az deployment sub show \
              --name "production-multi-${{ github.run_id }}" \
              --query 'properties.outputs.REGION_ENDPOINTS.value[]' -o json \
              | jq -r '.[] | "| \(.displayName) (\(.id)) | \(.containerAppName) | https://\(.fqdn) |"' \
              >> $GITHUB_STEP_SUMMARY
            TM_FQDN=$(az deployment sub show \
              --name "production-multi-${{ github.run_id }}" \
              --query 'properties.outputs.TRAFFIC_MANAGER_FQDN.value' -o tsv)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Traffic Manager FQDN:** \`$TM_FQDN\` (CNAME the apex domain here)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View your deployment in the [Azure Portal](https://portal.azure.com)" >> $GITHUB_STEP_SUMMARY
