name: Check Easy Auth secret expiration

# Opens a maintenance issue when the Entra app reg's client secret backing
# the ACMEbot Function App's Easy Auth has < 30 days to live. Deduplicates
# on label `easy-auth-rotation` so re-runs while the issue is open don't
# spam — the issue lives until a human closes it after rotating.
#
# Configuration (GitHub Actions repo variables):
#   EASYAUTH_APP_ID   Client/app ID of the Entra app reg backing Easy Auth on
#                     the ACMEbot function (e.g. b5ea2347-e30c-4707-9bbc-...).
#                     When empty, the job no-ops cleanly. Set it via:
#                       gh variable set EASYAUTH_APP_ID --body "<app-client-id>"
#
# Required OIDC secrets (already configured for azure-deploy.yml):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# The OIDC identity needs Microsoft.Graph application read scope to call
# `az ad app credential list`. The standard contributor SP used for
# azure-deploy.yml already has this when scoped at the tenant level via the
# federated GitHub workload identity.

on:
  schedule:
    # Mondays at 12:00 UTC. Daily would be overkill; monthly would miss
    # the 30-day warning window narrowly. Weekly catches the threshold
    # within a week of crossing it.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      force_open:
        description: 'Open the issue even if expiration is > 30 days away (testing only)'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  issues: write

env:
  EASYAUTH_APP_ID: ${{ vars.EASYAUTH_APP_ID }}
  EASYAUTH_FUNCTION_APP: func-astervoids
  EASYAUTH_FUNCTION_RG: sg-acmebot
  WARNING_THRESHOLD_DAYS: 30

jobs:
  check:
    name: Check secret expiration
    runs-on: ubuntu-latest
    steps:
      - name: Bail out if EASYAUTH_APP_ID is unset
        if: vars.EASYAUTH_APP_ID == ''
        run: |
          echo "::notice::EASYAUTH_APP_ID repo variable is not set; nothing to check."
          echo "To enable: gh variable set EASYAUTH_APP_ID --body '<app-client-id>'"
          exit 0

      - name: Checkout (for issue template)
        if: vars.EASYAUTH_APP_ID != ''
        uses: actions/checkout@v5

      - name: Log in to Azure
        if: vars.EASYAUTH_APP_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute days until secret expires
        if: vars.EASYAUTH_APP_ID != ''
        id: check
        run: |
          set -e
          # Pull all credential expirations; pick the LATEST (most-future) one
          # — that's the active secret. Other (older) credentials are noise
          # that will be deleted as part of the rotation runbook.
          EXPIRES=$(az ad app credential list --id "$EASYAUTH_APP_ID" \
            --query "[?endDateTime].endDateTime" -o tsv | sort -r | head -1)
          if [ -z "$EXPIRES" ]; then
            echo "::error::No client credentials found on app $EASYAUTH_APP_ID. Did the app reg get deleted?"
            exit 1
          fi
          NOW_EPOCH=$(date -u +%s)
          EXP_EPOCH=$(date -u -d "$EXPIRES" +%s)
          DAYS_LEFT=$(( (EXP_EPOCH - NOW_EPOCH) / 86400 ))
          echo "Latest credential expires at: $EXPIRES"
          echo "Days until expiration: $DAYS_LEFT"
          echo "days_left=$DAYS_LEFT" >> "$GITHUB_OUTPUT"
          echo "expires=$EXPIRES" >> "$GITHUB_OUTPUT"

      - name: Decide whether to open issue
        if: vars.EASYAUTH_APP_ID != ''
        id: decide
        env:
          DAYS_LEFT: ${{ steps.check.outputs.days_left }}
          FORCE: ${{ github.event.inputs.force_open }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::notice::force_open=true; opening issue regardless of days_left."
            echo "should_open=true" >> "$GITHUB_OUTPUT"
          elif [ "$DAYS_LEFT" -le "$WARNING_THRESHOLD_DAYS" ]; then
            echo "::notice::$DAYS_LEFT days <= $WARNING_THRESHOLD_DAYS day threshold; opening issue."
            echo "should_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$DAYS_LEFT days > $WARNING_THRESHOLD_DAYS day threshold; no action."
            echo "should_open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue (deduplicated by label)
        if: vars.EASYAUTH_APP_ID != '' && steps.decide.outputs.should_open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS_LEFT: ${{ steps.check.outputs.days_left }}
          EXPIRES: ${{ steps.check.outputs.expires }}
        run: |
          # Check for existing open issue with this label first — only one
          # rotation issue should ever be open at a time so we don't spam.
          EXISTING=$(gh issue list \
            --label easy-auth-rotation \
            --state open \
            --json number,title \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "::notice::Issue #$EXISTING is already open; not creating a duplicate."
            exit 0
          fi

          # Strip the YAML front-matter from the template (gh issue create
          # would otherwise treat it as part of the body).
          TEMPLATE=.github/ISSUE_TEMPLATE/easy-auth-secret-rotation.md
          BODY=$(awk 'BEGIN{fm=0} /^---\r?$/{fm++; next} fm>=2 {print}' "$TEMPLATE")
          # Prepend a header noting why this issue was opened.
          HEADER="> 🔔 Auto-opened by .github/workflows/check-easy-auth-secret.yml — secret expires in **$DAYS_LEFT days** (on $EXPIRES)."
          PRINTF_BODY=$(printf '%s\n\n%s' "$HEADER" "$BODY")

          gh issue create \
            --title "Rotate Easy Auth client secret (expires in $DAYS_LEFT days)" \
            --label maintenance \
            --label easy-auth-rotation \
            --body "$PRINTF_BODY"
